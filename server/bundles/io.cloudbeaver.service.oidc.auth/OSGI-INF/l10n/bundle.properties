# OIDC Authentication Provider Bundle
oidc-issuer-url=OIDC Issuer URL
oidc-issuer-url.description=Base URL of the OIDC provider (e.g., https://keycloak.example.com/auth/realms/myrealm)
oidc-client-id=Client ID
oidc-client-id.description=OIDC client identifier registered with the provider
oidc-client-secret=Client Secret
oidc-client-secret.description=OIDC client secret registered with the provider
oidc-scope=Scope
oidc-scope.description=OAuth2 scopes to request (default: openid profile email)
oidc-redirect-uri=Redirect URI
oidc-redirect-uri.description=Callback URL for OIDC authentication (e.g., https://dbeaver.example.com/oidc/callback)
oidc-groups-claim=Groups Claim
oidc-groups-claim.description=JSON claim name containing user groups/roles (default: groups)
oidc-username-claim=Username Claim
oidc-username-claim.description=JSON claim name containing username (default: preferred_username)
oidc-name-claim=Name Claim
oidc-name-claim.description=JSON claim name containing user's full name (default: name)
oidc-logout-url=Logout URL
oidc-logout-url.description=Optional custom logout endpoint URL
